apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "car-detector.fullname" . }}
  labels:
    {{- include "car-detector.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "car-detector.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "car-detector.serviceAccountName" . }}
      containers:
        - name: detector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.env.AWS_DEFAULT_REGION | quote }}
            - name: S3_BUCKET
              value: {{ .Values.env.S3_BUCKET | quote }}
            - name: S3_VIDEO_KEY
              value: {{ .Values.env.S3_VIDEO_KEY | quote }}
            - name: S3_LABELS_KEY
              value: {{ .Values.env.S3_LABELS_KEY | quote }}
            - name: S3_OUTPUT_PREFIX
              value: {{ .Values.env.S3_OUTPUT_PREFIX | quote }}
            - name: YOLO_WEIGHTS
              value: {{ .Values.env.YOLO_WEIGHTS | quote }}
            - name: CONF_THRESHOLD
              value: {{ .Values.env.CONF_THRESHOLD | quote }}
            - name: IOU_THRESHOLD
              value: {{ .Values.env.IOU_THRESHOLD | quote }}
            - name: LABELS_NORMALIZED
              value: {{ .Values.env.LABELS_NORMALIZED | quote }}
            - name: METRICS_GATE_BOX_METRICS
              value: {{ .Values.env.METRICS_GATE_BOX_METRICS | default "labeled" | quote }}
            - name: LABELED_GT_SHRINK
              value: {{ .Values.env.LABELED_GT_SHRINK | default "0.01" | quote }}
            - name: LABELED_BOX_IOU
              value: {{ .Values.env.LABELED_BOX_IOU | default "0.85" | quote }}
            {{- if .Values.env.MIN_PRECISION }}
            - name: MIN_PRECISION
              value: {{ .Values.env.MIN_PRECISION | quote }}
            {{- end }}
            {{- if .Values.env.MIN_RECALL }}
            - name: MIN_RECALL
              value: {{ .Values.env.MIN_RECALL | quote }}
            {{- end }}
            {{- if .Values.env.MIN_ACCURACY }}
            - name: MIN_ACCURACY
              value: {{ .Values.env.MIN_ACCURACY | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
